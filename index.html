<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d63d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blanchisserie La Reference</title>
<style>
:root{--g:#1d63d6;--gd:#1449a0;--gl:#e6efff;--o:#ff7300;--r:#c8372d;--rl:#fbe9e7;--a:#b7791f;--al:#fff4dc;--ok:#1b7f4b;--okl:#e4f4ea;--bg:#f4f6f8;--c:#fff;--t:#1b2229;--m:#68747e;--b:#dce2e7}
@media(prefers-color-scheme:dark){:root{--gl:#12293a;--rl:#3a1b18;--al:#38290d;--okl:#16301f;--bg:#111518;--c:#1a2025;--t:#eef2f5;--m:#97a4ae;--b:#2b343b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px}
header{background:#fff;color:#1b2229;padding:8px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--o)}
header img{height:44px}header h1{font-size:16px;margin:0;line-height:1.15}header small{color:#68747e}
#who{margin-left:auto;text-align:right;font-size:12px;color:#68747e;line-height:1.3}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;z-index:10}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--m);min-height:56px;position:relative}
nav button b{display:block;font-size:20px}nav button.on{color:var(--g);font-weight:700}
nav i{position:absolute;top:4px;right:22%;background:var(--r);color:#fff;font-style:normal;font-size:11px;border-radius:10px;padding:1px 6px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--m);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{border:2px solid var(--b);background:var(--c);color:var(--t);border-radius:14px;padding:12px 6px;text-align:center;min-height:78px;font-size:15px}
.svc:active{transform:scale(.97);border-color:var(--g)}.svc b{display:block}.svc span{color:var(--g);font-weight:700;font-size:14px}
.tile{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px}
.tile small{color:var(--m);display:block}.tile b{font-size:20px}
.tile.g{background:var(--gl)}.tile.r{background:var(--rl)}.tile.a{background:var(--al)}.tile.k{background:var(--okl)}
.btn{border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;width:100%;min-height:48px;cursor:pointer}
a.btn{display:block;text-align:center;text-decoration:none}
.btn.s{background:var(--c);color:var(--g);border:2px solid var(--g)}.btn.d{background:var(--r)}.btn.w{background:#1f9d55}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;min-height:38px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--b)}
.row:last-child{border-bottom:0}.row small{color:var(--m);display:block}
.pills{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.pills button{flex:1;white-space:nowrap;border:2px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:9px 10px;font-size:14px}
.pills button.on{border-color:var(--g);background:var(--gl);font-weight:700}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.st-recv{background:var(--al);color:var(--a)}.st-wash{background:var(--gl);color:var(--g)}.st-ready{background:var(--okl);color:var(--ok)}.st-done{background:var(--b);color:var(--m)}.st-void{background:var(--rl);color:var(--r)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:16px;background:var(--c);color:var(--t);margin:4px 0 10px;font-family:inherit}
label{font-size:13px;color:var(--m)}
#ov{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}
#sh{background:var(--c);width:100%;max-width:640px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m)}
.bars i{display:block;background:var(--g);border-radius:5px 5px 0 0;min-height:2px}
.bad{color:var(--r);font-weight:700}.ok{color:var(--ok);font-weight:700}.empty{text-align:center;color:var(--m);padding:24px 8px}
.tl{border-left:3px solid var(--g);margin:6px 0 6px 6px;padding-left:12px}.tl div{margin-bottom:8px;font-size:14px}.tl small{color:var(--m);display:block}
.job{border-left:5px solid var(--g)}.job.od{border-left-color:var(--r)}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0 12px}.chk input{width:24px;height:24px;margin:0}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px}
.cr{background:var(--o);color:#fff}
#net{display:none;position:fixed;top:0;left:0;right:0;background:var(--r);color:#fff;text-align:center;font-size:13px;padding:4px;z-index:40}
header{box-shadow:0 2px 10px #0000001a}
#brbar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;max-width:640px;margin:0 auto}
#brbar:empty{display:none}
.bchip{white-space:nowrap;border:2px solid var(--b);background:var(--c);color:var(--t);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700}
.bchip.on{color:#fff;border-color:transparent}
.hero{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0f3b86,#1d63d6 65%,#3b82f6);margin-bottom:12px;box-shadow:0 6px 18px #1d63d640}
.hero small{opacity:.85}.hero b.big{display:block;font-size:32px;letter-spacing:-.5px;margin:2px 0}
.hero .dl{font-size:13px}
h3.sec{font-size:14px;color:var(--m);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.4px}
.badge.br{background:var(--gl);color:var(--g)}
.stk{display:flex;flex-direction:column;border-radius:5px 5px 0 0;overflow:hidden;min-height:2px;background:var(--b)}
.bars .stk i{display:block;border-radius:0;min-height:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--m)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.brc{border-top:5px solid var(--g)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini div{background:var(--bg);border-radius:10px;padding:8px}.mini small{color:var(--m);display:block;font-size:12px}.mini b{font-size:15px}
.tile,.card{box-shadow:0 1px 3px #0000000f}
table.rt{width:100%;border-collapse:collapse;font-size:13px}.rt th,.rt td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--b)}.rt th:first-child,.rt td:first-child{text-align:left}.rt th{color:var(--m);font-weight:600;font-size:11px}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;display:block!important;background:none}#sh{box-shadow:none;max-width:none;max-height:none}#sh button,#sh a.btn{display:none!important}}
</style>
</head>
<body>
<header><img class="lg" alt="logo"><div><h1 id="ttl"></h1><small id="sub"></small></div><div id="who"></div></header><div id="brbar"></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"><div id="sh"></div></div>
<div id="toast"></div><div id="net"></div>

const ms=v=>v&&typeof v.toMillis==='function'?v.toMillis():(typeof v==='number'?v:Date.now());

function rebuild(){
 const tag=m=>Object.entries(m).flatMap(([br,l])=>l.map(e=>Object.assign({},e,{br})));const ents=tag(RAW.ledger).sort(cmp),J=new Map(),EX=[],VX=new Set();
 for(const e of ents){const tt=ms(e.ts);
  if(e.type==='expense'){EX.push({id:e.id,led:true,br:e.br,t:tt,label:e.label,amt:e.amt,cat:e.cat||'',by:e.byName||'-'});continue}
  if(e.type==='expvoid'){VX.add(e.eid);continue}
  if(e.type==='job'){if(J.has(e.jid))continue;J.set(e.jid,{id:e.jid,br:e.br,no:e.no,t:tt,cust:e.cust,phone:e.phone||'',items:e.items||[],pieces:e.pieces||1,due:e.due,note:e.note||'',status:'recv',log:[{t:tt,s:'recv',by:e.byName||'-'}],pay:[],credit:e.credit?{by:e.byName,payBy:e.credit.payBy,t:tt}:null,void:false});continue}
  const j=J.get(e.jid);if(!j)continue;
  if(e.type==='status'){j.status=e.s;j.log.push({t:tt,s:e.s,by:e.byName||'-'})}
  else if(e.type==='pay')j.pay.push({t:tt,amt:e.amt,m:e.m,k:e.k,by:e.byName||'-'});
  else if(e.type==='credit')j.credit={by:e.byName,payBy:e.payBy,t:tt};
  else if(e.type==='void'){j.void=true;j.reason=e.reason;j.voidAt=tt}}
 S.jobs=[...J.values()];
 const adm=tag(RAW.admin).sort(cmp);
 S.expenses=adm.filter(e=>e.type==='expense').map(e=>({id:e.id,br:e.br,t:ms(e.ts),label:e.label,amt:e.amt,by:e.byName})).concat(EX.filter(x=>!VX.has(x.id)));
 S.closes=adm.filter(e=>e.type==='close').map(e=>({br:e.br,day:e.day,expected:e.expected,counted:e.counted,t:ms(e.ts),by:e.byName}));
 const jm=new Map(S.jobs.map(j=>[j.id,j]));
 S.events=[...ents,...adm].sort(cmp).map(e=>({br:e.br,t:ms(e.ts),by:e.byName||'-',type:e.type,s:e.s,text:evText(e,jm)}))}
function evText(e,jm){const j=jm.get(e.jid),tag=j?`#${j.no} ${j.cust}`:'#?';
 switch(e.type){
  case 'job':return L(`Nouvelle commande #${e.no} – ${e.cust} – ${fmt((e.items||[]).reduce((a,i)=>a+i.qty*i.price,0))}${e.credit?' – 💳 CRÉDIT jusqu’au '+dd(e.credit.payBy):''}`,`New job #${e.no} – ${e.cust} – ${fmt((e.items||[]).reduce((a,i)=>a+i.qty*i.price,0))}${e.credit?' – 💳 CREDIT until '+dd(e.credit.payBy):''}`);
  case 'status':return `${tag} → ${t(e.s)}`;
  case 'pay':return e.amt<0?L(`Remboursement ${fmt(-e.amt)} – ${tag}`,`Refund ${fmt(-e.amt)} – ${tag}`):L(`${e.k==='deposit'?'Avance':'Paiement'} ${fmt(e.amt)} (${t(e.m)}) – ${tag}`,`${e.k==='deposit'?'Deposit':'Payment'} ${fmt(e.amt)} (${t(e.m)}) – ${tag}`);
  case 'credit':return L(`💳 CRÉDIT – ${tag} – à payer avant le ${dd(e.payBy)}`,`💳 CREDIT – ${tag} – to pay by ${dd(e.payBy)}`);
  case 'void':return L(`⚠ ${tag} ANNULÉE : ${e.reason}`,`⚠ ${tag} VOIDED: ${e.reason}`);
  case 'expvoid':return L(`⚠ Dépense annulée : ${e.label}`,`⚠ Expense voided: ${e.label}`);
  case 'expense':return L(`Dépense ${fmt(e.amt)} – ${e.label}`,`Expense ${fmt(e.amt)} – ${e.label}`);
  case 'close':{const df=e.counted-e.expected;return L(`Journée clôturée – caisse ${df===0?'correcte':(df<0?'manque ':'excédent ')+fmt(Math.abs(df))}`,`Day closed – cash ${df===0?'matches':(df<0?'missing ':'extra ')+fmt(Math.abs(df))}`)}
  default:return e.text||e.type}}

 else if(a==='forgot'){const em=($('#fe')&&$('#fe').value||'').trim();if(!em)return toast(t('askEmail'));FB.forgot(em).then(()=>toast(t('resetSent')),x=>toast(authMsg(x)))}
 else if(a==='resetpw'){FB.forgot(b.dataset.e).then(()=>toast(t('resetSent')),x=>toast(authMsg(x)))}
 else if(a==='rcpt')receiptSheet(job(id),null);
 else if(a==='copyrc')navigator.clipboard.writeText(rcText).then(()=>toast(t('copied')),()=>{});
 else if(a==='copymsg'){const v=$('#nm').value;navigator.clipboard.writeText(v).then(()=>toast(t('copied')),()=>{$('#nm').select()})}
 else if(a==='download')downloadBackup();
 else if(a==='detail')detail(job(id));
 else if(a==='gotoprices'){tab='more';sub='prices';render();scrollTo(0,0)}
 else if(a==='lang'){S.lang=S.lang==='fr'?'en':'fr';try{localStorage.setItem('lf_lang',S.lang)}catch(x){}rebuild();render()}
 else if(a==='staffform')sheet(`<h3>${t('addStaff')}</h3><label>${t('staffName')}</label><input name="n" required><label>${t('email')}</label><input name="e" type="email" inputmode="email" required><label>${t('pin')}</label><input name="p" type="password" minlength="6" autocomplete="new-password" required><label>${t('branch')}</label><select name="br" required><option value="">—</option>${S.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><button class="btn">${t('save')}</button>`,d=>{
   const em=d.e.trim().toLowerCase();if(S.users.some(u=>(u.email||'').toLowerCase()===em)){toast(t('emailUsed'));return false}if((d.p||'').length<6){toast(t('pinRule'));return false}
   FB.createStaff({name:d.n.trim(),email:em,pw:d.p,branch:d.br}).then(()=>{A('admin',{type:'staff',text:L(`Employé ajouté : ${d.n.trim()} (${brName(d.br)})`,`Staff added: ${d.n.trim()} (${brName(d.br)})`)},d.br);toast(t('staffAdded'))},x=>toast(authMsg(x)))});
 else if(a==='togglestaff'){const u=S.users.find(x=>x.id===id),nv=u.active===false;FB.setActive(id,nv);A('admin',{type:'staff',text:L(`${u.name} ${nv?'réactivé':'désactivé'}`,`${u.name} ${nv?'reactivated':'deactivated'}`)},u.branch)}
 else if(a==='addpay'){const j=job(id),n0=j.pay.length;sheet(`<h3>${t('addPay')} · #${j.no}</h3><div class="row"><span>${t('balance')}</span><b>${fmt(jbal(j))}</b></div><label>${t('amount')}</label><input name="a" type="number" min="1" max="${Math.max(1,jbal(j))}" value="${jbal(j)||''}" inputmode="numeric" required><label>${t('method')}</label><select name="m"><option value="cash">${t('cash')}</option><option value="mobile">${t('mobile')}</option></select><button class="btn">${t('save')}</button>`,d=>{
   A('ledger',{type:'pay',jid:j.id,amt:+d.a,m:d.m,k:'balance'},j.br);waitFor(()=>{const x=job(j.id);return x&&x.pay.length>n0?x:null}).then(x=>x&&receiptSheet(x,'pay'))})}
 else if(a==='voidjob'){const j=job(id);sheet(`<h3>${t('void_')} · #${j.no}</h3>${jpaid(j)>0?`<p class="bad">${t('refund')}: ${fmt(jpaid(j))}</p>`:''}<label>${t('reason')}</label><input name="r" required><button class="btn d">${t('void_')}</button>`,d=>{
   if(jpaid(j)>0)A('ledger',{type:'pay',jid:j.id,amt:-jpaid(j),m:'cash',k:'refund'},j.br);A('ledger',{type:'void',jid:j.id,reason:d.r.trim()},j.br)})}
 else if(a==='addexp')sheet(`<h3>${t('addExp')}</h3><label>${t('label')}</label><input name="l" required><label>${t('amount')}</label><input name="a" type="number" min="1" inputmode="numeric" required><label>${t('category')}</label><select name="c">${['',...L(['Produits (savon, etc.)','Transport','Eau / Électricité','Repas','Réparation','Salaire / Avance','Autre'],['Supplies (soap, etc.)','Transport','Water / Electricity','Meals','Repairs','Salary / Advance','Other'])].map(x=>`<option value="${x}">${x||t('catSel')}</option>`).join('')}</select>${brField()}<button class="btn">${t('save')}</button>`,d=>{A('ledger',{type:'expense',label:d.l.trim(),amt:+d.a,cat:d.c||''},pickBr(d));toast(t('saved'))});
 else if(a==='svcform'){const s=id?svc(id):null;sheet(`<h3>${t('prices')}</h3><label>${t('sname')}</label><input name="n" required value="${s?esc(s.name):''}"><label>${t('unit')}</label><input name="u" required value="${s?esc(s.unit):'pièce'}"><label>${t('price')}</label><input name="p" type="number" min="0" inputmode="numeric" required value="${s?s.price:''}"><button class="btn">${t('save')}</button>${s?`<button type="button" class="btn d" data-a="svcdel" data-id="${s.id}" style="margin-top:8px">${t('del')}</button>`:''}`,d=>{
   const list=S.services.map(x=>Object.assign({},x));if(s){const x=list.find(y=>y.id===s.id);x.name=d.n.trim();x.unit=d.u.trim();x.price=+d.p}else list.push({id:uid(),name:d.n.trim(),unit:d.u.trim(),price:+d.p});FB.saveSettings({services:list})})}
 else if(a==='svcdel'){FB.saveSettings({services:S.services.filter(x=>x.id!==id)});delete draft.items[id];closeSheet()}
 else if(a==='matform'){const m=id?S.materials.find(x=>x.id===id):null;sheet(`<h3>${t('materials')}</h3><label>${t('name')}</label><input name="n" required value="${m?esc(m.name):''}"><label>${t('unitCost')}</label><input name="c" type="number" min="0" inputmode="numeric" required value="${m?m.cost:''}"><label>${t('qty')}</label><input name="q" type="number" min="0" inputmode="numeric" required value="${m?m.qty:1}">${m?'':brField()}<button class="btn">${t('save')}</button>${m?`<button type="button" class="btn d" data-a="matdel" data-id="${m.id}" style="margin-top:8px">${t('del')}</button>`:''}`,d=>{
   const mb=m?m.br:pickBr(d);FB.matSet(mb,m?m.id:uid(),{name:d.n.trim(),cost:+d.c,qty:+d.q});A('admin',{type:'mat',text:L(`Matériel : ${d.n.trim()} (${d.q} × ${fmt(+d.c)})`,`Material: ${d.n.trim()} (${d.q} × ${fmt(+d.c)})`)},mb)})}
 else if(a==='matdel'){const m=S.materials.find(x=>x.id===id);FB.matDel(m.br,id);A('admin',{type:'mat',text:L(`Matériel supprimé : ${m.name}`,`Material deleted: ${m.name}`)},m.br);closeSheet()}
 else if(a==='matuse'){const m=S.materials.find(x=>x.id===id);sheet(`<h3>${t('useMat')} : ${esc(m.name)}</h3><label>${t('qtyUse')}</label><input name="q" type="number" min="1" max="${m.qty}" value="1" required inputmode="numeric"><button class="btn">${t('save')}</button>`,d=>{const q=Math.min(+d.q,m.qty);FB.matSet(m.br,m.id,{name:m.name,cost:m.cost,qty:m.qty-q});A('admin',{type:'mat',text:L(`Matériel utilisé : ${m.name} × ${q} (reste ${m.qty-q})`,`Material used: ${m.name} × ${q} (${m.qty-q} left)`)},m.br)})}
 else if(a==='matrestock'){const m=S.materials.find(x=>x.id===id);sheet(`<h3>${t('restockMat')} : ${esc(m.name)}</h3><label>${t('qty')} (+)</label><input name="q" type="number" min="1" value="1" required inputmode="numeric"><label>${t('unitCost')}</label><input name="c" type="number" min="0" value="${m.cost}" required inputmode="numeric"><label class="chk"><input type="checkbox" name="chk"><span>${t('asExpense')}</span></label><button class="btn">${t('save')}</button>`,d=>{const q=+d.q,c=+d.c;FB.matSet(m.br,m.id,{name:m.name,cost:c,qty:m.qty+q});if(d._chk)A('admin',{type:'expense',label:L('Achat : ','Purchase: ')+m.name+' × '+q,amt:q*c},m.br);A('admin',{type:'mat',text:L(`Matériel acheté : ${m.name} × ${q} à ${fmt(c)}`,`Material bought: ${m.name} × ${q} at ${fmt(c)}`)},m.br)})}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.type==='checkbox')return;
 if(el.dataset.d)draft[el.dataset.d]=el.value;
 else if(el.dataset.q){draft.items[el.dataset.q]=+el.value||0;$('#dtot').textContent=fmt(dTotal())}
 else if(el.dataset.j){JQ=el.value;$('#jl').innerHTML=jlist()}
 else if(el.dataset.sb){const id=el.dataset.sb,v=el.value;clearTimeout(sTimers['b'+id]);sTimers['b'+id]=setTimeout(()=>FB.saveSettings({branches:S.branches.map(b=>b.id===id?Object.assign({},b,{name:v}):b)}),700)}
 else if(el.dataset.s){const k=el.dataset.s,v=el.value;clearTimeout(sTimers[k]);sTimers[k]=setTimeout(()=>FB.saveSettings({[k]:v}),700)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.type==='checkbox'){if(el.dataset.d){draft[el.dataset.d]=el.checked;const y=scrollY;render();scrollTo(0,y)}else if(el.dataset.s){FB.saveSettings({[el.dataset.s]:el.checked})}return}
 if(el.dataset.d)draft[el.dataset.d]=el.value});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const k=f.dataset.f;
 if(k==='close'){const d=today(),br=wb();if(!br)return;const s=stats(d,br);A('admin',{type:'close',day:d,expected:s.cashExp,counted:+f.elements.c.value},br)}
 else if(k==='login')await doLogin(f);
 else if(k==='setup')await doSetup(f);
 else if(k==='signup')await doSignup(f)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
netBanner();boot();

</script>
